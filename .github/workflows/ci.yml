name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-validate:
    name: Lint Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.2

      - name: Lint Demo Chart
        run: helm lint chart/

      - name: Lint Lab Fixed Chart
        run: helm lint lab/broken-chart/

      - name: Template Verification
        run: |
          helm template demo chart/ --set replicaCount=3 --set config.appName=ci-test
          helm template debug-lab lab/broken-chart/ -n debug-lab

  build-and-scan:
    name: Build & Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Service Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./service
          load: true
          tags: demo-service:local-scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: demo-service:local-scan
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
